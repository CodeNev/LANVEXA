<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanvexa</title>
<link rel="stylesheet" href="/static/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="auth-body">
<div class="auth-shell">
  <div class="auth-brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 12h4l2-6 4 12 2-6h4"/>
      </svg>
    </div>
    <div>
      <div class="brand-name">LANVEXA</div>
      <div class="brand-sub">Game Tunneling Platform</div>
    </div>
  </div>

  <div class="auth-card">
    <div class="tabs">
      <button class="tab active" data-mode="login" type="button">ورود / Sign In</button>
      <button class="tab" data-mode="register" type="button">ثبت‌نام / Sign Up</button>
    </div>

    <form id="auth-form">
      <label>
        <span>Username</span>
        <input name="username" required autocomplete="username" minlength="3" maxlength="32" pattern="[a-zA-Z0-9_]+">
      </label>
      <label>
        <span>Password</span>
        <input name="password" type="password" required autocomplete="current-password" minlength="6">
      </label>
      <button class="btn primary full" type="submit" id="submit-btn">Sign In</button>
      <div class="error" id="auth-error" hidden></div>
    </form>
  </div>

  <div class="auth-footer">
    <a class="gh" href="https://github.com/CodeNev/LANVEXA" target="_blank" rel="noopener noreferrer">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
        <path d="M9 18c-4.51 2-5-2-7-2"/>
      </svg>
      <span>GitHub</span>
    </a>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
