<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lanvexa</title>
<link rel="stylesheet" href="/static/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark small">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 12h4l2-6 4 12 2-6h4"/>
        </svg>
      </div>
      <span class="brand-name">LANVEXA</span>
    </div>

    <nav class="nav">
      <a href="#" class="nav-item active" data-page="dashboard">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        <span>Dashboard</span>
      </a>
      <a href="#" class="nav-item" data-page="create">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
        <span>Create Tunnel</span>
      </a>
      <a href="#" class="nav-item" data-page="activity">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-9 4 18 3-9h4"/></svg>
        <span>Activity</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <a class="gh" href="https://github.com/CodeNev/LANVEXA" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.4 5.4 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"/>
          <path d="M9 18c-4.51 2-5-2-7-2"/>
        </svg>
        <span>GitHub</span>
      </a>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="net-status">
        <span class="dot online"></span>
        <span>Network Operational</span>
      </div>
      <div class="topbar-actions">
        <button class="iconbtn" id="logout" type="button" title="Sign out">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
    </header>

    <section class="page" id="page-dashboard">
      <div class="page-header">
        <div>
          <h1>Hello, <span id="user-name"></span></h1>
          <p class="muted">Manage your game tunnels and monitor your network.</p>
        </div>
        <button class="btn primary" data-goto="create" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>
          <span>Create Tunnel</span>
        </button>
      </div>

      <div class="stat-grid">
        <div class="stat"><div class="stat-label">Active Tunnels</div><div class="stat-value" id="stat-active">0</div></div>
        <div class="stat"><div class="stat-label">Online Connections</div><div class="stat-value" id="stat-conn">0</div></div>
        <div class="stat"><div class="stat-label">Bandwidth</div><div class="stat-value" id="stat-bw">0 B</div></div>
        <div class="stat"><div class="stat-label">Uptime</div><div class="stat-value" id="stat-uptime">99.98%</div></div>
      </div>

      <div class="card">
        <div class="card-header"><h2>Your Tunnels</h2></div>
        <div id="tunnels-list" class="list"></div>
      </div>
    </section>

    <section class="page" id="page-create" hidden>
      <div class="page-header"><h1>Create Tunnel</h1></div>
      <form class="card form" id="create-form">
        <label>
          <span>Tunnel Name</span>
          <input name="name" required maxlength="64" placeholder="Minecraft Survival">
        </label>
        <label>
          <span>Game</span>
          <select name="game" id="game-select">
            <option value="minecraft-java">Minecraft Java</option>
            <option value="terraria">Terraria</option>
            <option value="cs16">CS 1.6</option>
            <option value="valheim">Valheim</option>
            <option value="custom">Custom</option>
          </select>
        </label>
        <label>
          <span>Protocol</span>
          <select name="protocol" id="protocol-select">
            <option value="tcp">TCP</option>
          </select>
        </label>
        <div class="row">
          <label class="grow">
            <span>Local Host</span>
            <input name="local_host" value="127.0.0.1" required>
          </label>
          <label class="grow">
            <span>Local Port</span>
            <input name="local_port" type="number" min="1" max="65535" value="25565" required>
          </label>
        </div>
        <div class="actions">
          <button type="submit" class="btn primary">Create Tunnel</button>
        </div>
      </form>
    </section>

    <section class="page" id="page-activity" hidden>
      <div class="page-header"><h1>Activity</h1></div>
      <div class="card"><div id="activity-list" class="list"></div></div>
    </section>
  </main>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/app.js"></script>
</body>
</html>
